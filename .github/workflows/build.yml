name: Build and Push to ghcr.io

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar timestamp para cache bust
        id: vars
        run: echo "CACHEBUST=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build e push (FORCANDO NO-CACHE)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            CACHEBUST=${{ steps.vars.outputs.CACHEBUST }}
          tags: |
            ghcr.io/bootdanniel/akash-worker:latest
            ghcr.io/bootdanniel/akash-worker:v2
