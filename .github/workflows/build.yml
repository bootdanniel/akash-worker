name: build-worker
on:
  push:
    branches: [main]
    paths: ["Dockerfile", "worker_watermark.py", ".github/workflows/build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/bootdanniel/akash-worker:watermark
            ghcr.io/bootdanniel/akash-worker:watermark-v2
